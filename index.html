<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rungs — 7-Day Strength &amp; Tone</title>
<meta name="theme-color" content="#14161B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161B;
    --surface:#1D2028;
    --surface-2:#262A34;
    --text:#ECEBE6;
    --muted:#8B92A0;
    --accent:#FF5A36;
    --accent-soft:rgba(255,90,54,0.14);
    --good:#3DDC97;
    --good-soft:rgba(61,220,151,0.14);
    --border:#2A2F3A;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:84px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  a{color:inherit;}

  /* ---------- HEADER ---------- */
  header.top{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,90,54,0.06), transparent 70%);
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px;
  }
  h1.title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--muted);
    font-size:14px;
    margin:0 0 20px;
  }

  /* ---------- LADDER (signature element) ---------- */
  .ladder{
    display:flex;
    align-items:center;
    gap:0;
    position:relative;
  }
  .rung-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }
  .rail{
    position:absolute;
    top:16px;
    left:-50%;
    width:100%;
    height:2px;
    background:var(--border);
    z-index:0;
  }
  .rung-wrap:first-child .rail{display:none;}
  .rail.filled{background:var(--good);}
  .rung{
    width:30px;
    height:30px;
    border-radius:10px;
    border:2px solid var(--border);
    background:var(--surface);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-mono);
    font-weight:600;
    font-size:12px;
    color:var(--muted);
    position:relative;
    z-index:1;
    transition:all .2s ease;
  }
  .rung.today{
    border-color:var(--accent);
    color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .rung.done{
    border-color:var(--good);
    background:var(--good-soft);
    color:var(--good);
  }
  .rung-label{
    font-size:10px;
    color:var(--muted);
    margin-top:6px;
    letter-spacing:.04em;
  }

  /* ---------- MAIN ---------- */
  main{
    padding:20px;
    max-width:640px;
    margin:0 auto;
  }
  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
  }

  .day-heading{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:2px;
  }
  .day-heading h2{
    font-family:var(--font-display);
    font-size:20px;
    margin:0;
  }
  .day-focus{
    color:var(--muted);
    font-size:13px;
    margin:0 0 16px;
  }

  .section-label{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin:18px 0 8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .section-label:first-of-type{margin-top:2px;}

  .exercise-item{
    border-bottom:1px solid var(--border);
  }
  .exercise-item:last-child{border-bottom:none;}
  .exercise{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
  }
  .checkbox{
    width:22px;
    height:22px;
    border-radius:7px;
    border:2px solid var(--border);
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .15s ease;
    background:var(--surface-2);
  }
  .checkbox.checked{
    background:var(--good);
    border-color:var(--good);
  }
  .checkbox.checked::after{
    content:"✓";
    color:var(--bg);
    font-size:13px;
    font-weight:700;
  }
  .ex-info{flex:1; min-width:0; display:flex; align-items:center; flex-wrap:wrap;}
  .ex-name{
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
  }
  .ex-name.struck{
    color:var(--muted);
    text-decoration:line-through;
    text-decoration-color:var(--good);
  }
  .ex-sets{
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--accent);
    white-space:nowrap;
    margin-left:8px;
  }
  .warmup .ex-sets, .cooldown .ex-sets{color:var(--muted);}

  .icon-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--muted);
    width:26px;
    height:26px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    cursor:pointer;
    flex-shrink:0;
    margin-left:6px;
    transition:all .15s ease;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--muted);}
  .icon-btn.timer-btn{color:var(--accent); border-color:rgba(255,90,54,0.35);}
  .icon-btn.info-open{color:var(--text); border-color:var(--muted);}
  .icon-btn.swap-btn{color:var(--accent);}

  .ex-desc{
    display:none;
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
    padding:0 0 12px 32px;
    margin-top:-4px;
  }
  .ex-desc.open{display:block;}

  .ex-badge{
    font-size:9.5px;
    color:var(--accent);
    background:var(--accent-soft);
    border-radius:6px;
    padding:2px 6px;
    margin-left:8px;
    font-family:var(--font-mono);
    letter-spacing:.03em;
    white-space:nowrap;
  }

  .ex-badge.custom{color:var(--good); background:var(--good-soft);}
  .icon-btn.delete-btn{color:#FF6B6B; border-color:rgba(255,107,107,0.35);}

  .add-move-btn{
    background:none;
    border:1px dashed var(--border);
    color:var(--muted);
    border-radius:10px;
    padding:9px 12px;
    font-size:12.5px;
    font-family:var(--font-body);
    cursor:pointer;
    width:100%;
    text-align:center;
    margin-top:4px;
  }
  .add-move-btn:hover{color:var(--accent); border-color:var(--accent);}
  .add-move-form{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:4px;
    padding:12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
  }
  .add-move-form input{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:var(--font-body);
  }
  .add-move-form .row-btns{
    display:flex;
    gap:8px;
    margin-top:2px;
  }
  .add-move-form .row-btns button{
    flex:1;
    border-radius:8px;
    padding:8px 10px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    border:1px solid var(--border);
  }
  .add-move-form .row-btns button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#1A0D08;
  }
  .add-move-form .row-btns button.cancel{
    background:var(--surface);
    color:var(--muted);
  }

  /* Swap panel */
  .swap-panel{
    padding:0 0 14px 32px;
  }
  .swap-title{
    font-family:var(--font-mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent);
    margin-bottom:8px;
  }
  .swap-options{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .swap-options button{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:999px;
    padding:5px 12px;
    font-size:12px;
    cursor:pointer;
  }
  .swap-options button.active{
    border-color:var(--accent);
    color:var(--accent);
  }
  .swap-custom{
    display:flex;
    gap:6px;
    margin-bottom:6px;
  }
  .swap-custom input{
    flex:1;
    min-width:0;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:12.5px;
    font-family:var(--font-body);
  }
  .swap-custom button{
    background:var(--accent);
    border:none;
    color:#1A0D08;
    border-radius:8px;
    padding:8px 14px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  .swap-reset{
    background:none;
    border:none;
    color:var(--muted);
    text-decoration:underline;
    font-size:11.5px;
    cursor:pointer;
    padding:2px 0 0;
  }

  /* Weight/rep logging */
  .log-row{
    display:flex;
    gap:8px;
    padding:0 0 8px 32px;
  }
  .log-field{flex:1; max-width:140px;}
  .log-field label{
    display:block;
    font-size:10px;
    color:var(--muted);
    font-family:var(--font-mono);
    letter-spacing:.05em;
    margin-bottom:3px;
  }
  .log-field input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:7px 9px;
    font-size:13px;
    font-family:var(--font-mono);
  }
  .log-last{
    font-size:11px;
    color:var(--muted);
    padding:0 0 12px 32px;
    margin-top:-4px;
  }

  /* Day picker on Today tab */
  .day-select-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:14px;
  }
  .day-select-card select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-body);
    font-size:13.5px;
    padding:10px 12px;
    border-radius:10px;
    margin-top:8px;
  }
  .day-select-hint{
    font-size:12px;
    color:var(--muted);
    margin:8px 0 0;
    line-height:1.4;
  }
  .makeup-note{
    background:var(--accent-soft);
    border:1px solid rgba(255,90,54,0.3);
    color:var(--accent);
    border-radius:10px;
    padding:10px 14px;
    font-size:12.5px;
    font-weight:500;
    margin-bottom:14px;
  }

  .complete-banner{
    background:var(--good-soft);
    border:1px solid rgba(61,220,151,0.35);
    color:var(--good);
    border-radius:10px;
    padding:12px 14px;
    font-size:13.5px;
    font-weight:500;
    margin-top:16px;
    display:none;
  }
  .complete-banner.show{display:block;}

  .rest-card{
    text-align:center;
    padding:40px 20px;
  }
  .rest-card .big{
    font-family:var(--font-display);
    font-size:22px;
    margin-bottom:8px;
  }
  .rest-card p{color:var(--muted); font-size:14px; margin:0;}

  /* Workout tab: week accordion */
  .week-day{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .week-day-head{
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .week-day-head h3{
    font-family:var(--font-display);
    font-size:16px;
    margin:0;
  }
  .week-day-head span.f{
    color:var(--muted);
    font-size:12.5px;
    display:block;
    margin-top:2px;
  }
  .chevron{
    color:var(--muted);
    transition:transform .2s ease;
    font-size:14px;
  }
  .week-day.open .chevron{transform:rotate(180deg);}
  .week-day-body{
    display:none;
    padding:0 18px 16px;
  }
  .week-day.open .week-day-body{display:block;}

  /* Progress tab */
  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .stat{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    text-align:center;
  }
  .stat .num{
    font-family:var(--font-display);
    font-size:26px;
    color:var(--accent);
  }
  .stat .lab{
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
    letter-spacing:.03em;
  }
  .bars{
    display:flex;
    align-items:flex-end;
    gap:8px;
    height:120px;
    padding:10px 4px 0;
  }
  .bar-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    gap:6px;
  }
  .bar{
    width:100%;
    max-width:28px;
    border-radius:6px 6px 3px 3px;
    background:var(--surface-2);
    transition:height .3s ease;
  }
  .bar.done{background:var(--good);}
  .bar.rest{background:transparent; border:1px dashed var(--border);}
  .bar-lab{font-size:10px; color:var(--muted); font-family:var(--font-mono);}

  /* Coach tab */
  .tip-card{
    background:linear-gradient(160deg, var(--surface), var(--surface-2));
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    margin-bottom:16px;
  }
  .tip-eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:.1em;
    margin-bottom:8px;
  }
  .tip-body{
    font-size:15.5px;
    line-height:1.55;
  }
  .principle{
    display:flex;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--border);
  }
  .principle:last-child{border-bottom:none;}
  .principle .n{
    font-family:var(--font-mono);
    color:var(--accent);
    font-size:13px;
    flex-shrink:0;
    padding-top:1px;
  }
  .principle .p-title{font-weight:600; font-size:14.5px; margin-bottom:2px;}
  .principle .p-body{color:var(--muted); font-size:13.5px; line-height:1.5;}

  /* ---------- BOTTOM NAV ---------- */
  nav.bottom{
    position:fixed;
    bottom:0; left:0; right:0;
    background:rgba(29,32,40,0.92);
    backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.bottom button{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--font-body);
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 0;
    cursor:pointer;
    border-radius:10px;
  }
  nav.bottom button .ic{font-size:19px;}
  nav.bottom button.active{color:var(--accent);}
  nav.bottom button:focus-visible, .checkbox:focus-visible, .week-day-head:focus-visible, .icon-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  /* ---------- FLOATING REST TIMER ---------- */
  .fab-rest{
    position:fixed;
    right:18px;
    bottom:96px;
    background:var(--accent);
    color:#1A0D08;
    border:none;
    border-radius:999px;
    padding:12px 18px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    display:flex;
    align-items:center;
    gap:7px;
    box-shadow:0 6px 20px rgba(255,90,54,0.35);
    cursor:pointer;
    z-index:9;
  }
  .fab-rest .ic{font-size:15px;}

  /* ---------- TIMER MODAL ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,11,14,0.72);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .timer-modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px 24px 24px;
    width:100%;
    max-width:340px;
    text-align:center;
    position:relative;
  }
  .timer-modal.alarm{
    animation:flashAlarm 0.6s ease 3;
  }
  @keyframes flashAlarm{
    0%,100%{box-shadow:0 0 0 0 rgba(255,90,54,0);}
    50%{box-shadow:0 0 0 8px rgba(255,90,54,0.25);}
  }
  .timer-close{
    position:absolute;
    top:14px; right:14px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    cursor:pointer;
    width:28px; height:28px;
  }
  .timer-label{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:14px;
  }
  .timer-display{
    font-family:var(--font-display);
    font-size:56px;
    font-weight:700;
    margin-bottom:18px;
    letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
  }
  .timer-controls{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:18px;
  }
  .timer-controls button{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    border-radius:10px;
    padding:10px 18px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    cursor:pointer;
  }
  .timer-controls button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#1A0D08;
  }
  .timer-adjust{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:14px;
  }
  .timer-adjust button{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:8px;
    padding:6px 10px;
    font-family:var(--font-mono);
    font-size:12px;
    cursor:pointer;
  }
  .timer-presets{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
  }
  .timer-presets button{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:999px;
    padding:5px 12px;
    font-family:var(--font-mono);
    font-size:11.5px;
    cursor:pointer;
  }
  .timer-presets button.active{
    color:var(--accent);
    border-color:var(--accent);
  }
</style>
</head>
<body>

<header class="top">
  <p class="eyebrow">Home Gym · Fat Loss &amp; Tone</p>
  <h1 class="title">Rungs</h1>
  <p class="subtitle" id="weekSubtitle">Your 7-day plan. No two weekdays repeat.</p>
  <div class="ladder" id="ladder"></div>
</header>

<main>
  <section class="view active" id="view-today"></section>
  <section class="view" id="view-workout"></section>
  <section class="view" id="view-progress"></section>
  <section class="view" id="view-coach"></section>
</main>

<button class="fab-rest" id="restTimerBtn"><span class="ic">⏱</span>Rest Timer</button>

<nav class="bottom">
  <button data-view="today" class="active"><span class="ic">🏠</span>Today</button>
  <button data-view="workout"><span class="ic">🏋️</span>Workout</button>
  <button data-view="progress"><span class="ic">📈</span>Progress</button>
  <button data-view="coach"><span class="ic">✨</span>Coach</button>
</nav>

<div class="modal-overlay" id="timerOverlay">
  <div class="timer-modal" id="timerModal">
    <button class="timer-close" id="timerClose">✕</button>
    <div class="timer-label" id="timerLabel">REST</div>

  function isDayComplete(dateK, dayIdx){ return dayCompletion(dateK, dayIdx) >= 1; }

  function overrideKey(dayIdx, section, i){ return dayIdx+"|"+section+"|"+i; }
  function weeklyRotatedName(section, original){
    // Only rotate Main Work — warm-ups/cool-downs stay stable week to week.
    if(section !== 'main') return original;
    const info = poolIndexOf(original);
    if(!info) return original;
    const newIdx = (info.idx + currentWeekIdx) % info.pool.length;
    return info.pool[newIdx];
  }
  function effectiveName(dayIdx, section, i, original){
    const v = overrides[overrideKey(dayIdx, section, i)];
    if(v) return v; // a manual swap always wins over the automatic weekly rotation
    return weeklyRotatedName(section, original);
  }
  function progressedSets(exName, setsStr, section, hasTimer){
    // Family lifts (ones with a swap pool) follow the week's training style —
    // e.g. fewer reps on a Strength week, more on a Burnout week. Exercises
    // with no pool (Stair Sprints, the kneeling core moves) just climb
    // steadily each week of the cycle instead.
    if(section !== 'main' || hasTimer) return setsStr;
    const inPool = !!poolIndexOf(exName);
    const delta = inPool ? currentWeekStyle.repsDelta : currentWeekIdx;
    if(delta === 0) return setsStr;
    let m = setsStr.match(/(\d+)\s*[–-]\s*(\d+)/);
    if(m){
      const lo = Math.max(4, parseInt(m[1],10) + delta);
      const hi = Math.max(lo+1, parseInt(m[2],10) + delta);
      return setsStr.replace(m[0], lo+'–'+hi);
    }
    m = setsStr.match(/×\s*(\d+)(?!\s*(rounds|sec))/);
    if(m){
      const val = Math.max(4, parseInt(m[1],10) + delta);
      return setsStr.replace(m[0], '× '+val);
    }
    return setsStr;
  }
  function setOverride(dayIdx, section, i, name, original){
    const k = overrideKey(dayIdx, section, i);
    if(!name || name === original){ delete overrides[k]; }
    else overrides[k] = name;
    saveOverrides(overrides);
  }

  function findLastLog(dayIdx, section, i, excludeDateK){
    const logKey = section+"-"+i;
    const keys = Object.keys(store).filter(k=>k!==excludeDateK).sort().reverse();
    for(const k of keys){
      if(planIdxForDate(k) !== dayIdx) continue;
      const rec = store[k];
      if(rec.logs && rec.logs[logKey] && (rec.logs[logKey].weight != null || rec.logs[logKey].reps != null)){
        return Object.assign({date:k}, rec.logs[logKey]);
      }
    }
    return null;
  }
  function combinedMainNote(baseNote){
    return (baseNote ? baseNote + ' ' : '') + currentWeekStyle.note;
  }
  function suggestedWeight(last){
    if(!last || last.weight == null) return null;
    if(currentWeekStyle.weightBump <= 0) return null;
    return Math.round((last.weight + currentWeekStyle.weightBump) * 2) / 2; // nearest 0.5
  }

  // ---------------- TIMER ----------------
  let timerState = { total:60, remaining:60, running:false, interval:null, endTime:null };
  let sharedAudioCtx = null;
  let wakeLock = null;
  const TIMER_STATE_KEY = "rungs-timer-state-v1";

  function unlockAudio(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
      if(sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
    }catch(e){ /* audio not available */ }
  }
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
      }
    }catch(e){ /* not supported or denied — safe to ignore */ }
  }
  function releaseWakeLock(){
    if(wakeLock){
      wakeLock.release().catch(()=>{});
      wakeLock = null;
    }
  }
  function saveTimerState(){
    try{
      localStorage.setItem(TIMER_STATE_KEY, JSON.stringify({
        endTime: timerState.endTime,
        total: timerState.total,
        label: labelEl.textContent
      }));
    }catch(e){}
  }
  function clearSavedTimerState(){
    try{ localStorage.removeItem(TIMER_STATE_KEY); }catch(e){}
  }
  function loadSavedTimerState(){
    try{ return JSON.parse(localStorage.getItem(TIMER_STATE_KEY)); }
    catch(e){ return null; }

  const overlay = document.getElementById('timerOverlay');
  const modal = document.getElementById('timerModal');

  const labelEl = document.getElementById('timerLabel');
  const startPauseBtn = document.getElementById('timerStartPause');
  const presetsEl = document.getElementById('timerPresets');
  const PRESET_OPTIONS = [15,30,45,60,90];

  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
  }
  function renderPresets(){
    presetsEl.innerHTML = "";
    PRESET_OPTIONS.forEach(p=>{
      const b = document.createElement('button');
      b.textContent = p+"s";
      if(p === timerState.total) b.classList.add('active');
      b.addEventListener('click', ()=>{
        stopInterval();
        timerState.total = p;
        timerState.remaining = p;
        timerState.running = false;
        updateDisplay();
        startPauseBtn.textContent = "Start";
        renderPresets();
      });
      presetsEl.appendChild(b);
    });
  }
  function updateDisplay(){ displayEl.textContent = fmt(timerState.remaining); }
  function stopInterval(){
    if(timerState.interval){ clearInterval(timerState.interval); timerState.interval = null; }
  }
  function playAlarm(){
    try{
      unlockAudio();
      const ctx = sharedAudioCtx;
      const freqs = [880,988,1174];
      freqs.forEach((f,i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.35);
        gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + i*0.35 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.35 + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i*0.35);
        osc.stop(ctx.currentTime + i*0.35 + 0.32);
      });
    }catch(e){ /* audio not available, fail silently */ }
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
    modal.classList.add('alarm');
    setTimeout(()=>modal.classList.remove('alarm'), 1900);
  }
  function tick(){
    if(timerState.endTime != null){
      timerState.remaining = Math.max(0, Math.ceil((timerState.endTime - Date.now())/1000));
    } else {
      timerState.remaining -= 1;
    }
    if(timerState.remaining <= 0){
      timerState.remaining = 0;
      updateDisplay();
      stopInterval();
      timerState.running = false;
      timerState.endTime = null;
      startPauseBtn.textContent = "Start";
      clearSavedTimerState();
      releaseWakeLock();
      playAlarm();
      return;
    }
    updateDisplay();
  }
  function openTimer(seconds, label){
    unlockAudio();
    stopInterval();
    releaseWakeLock();
    clearSavedTimerState();
    timerState.total = seconds;
    timerState.remaining = seconds;
    timerState.running = false;
    timerState.endTime = null;
    labelEl.textContent = label.toUpperCase();
    startPauseBtn.textContent = "Start";
    updateDisplay();
    renderPresets();
    overlay.classList.add('show');
  }
  function closeTimer(){
    stopInterval();
    timerState.running = false;
    timerState.endTime = null;
    clearSavedTimerState();
    releaseWakeLock();
    overlay.classList.remove('show');
  }
  startPauseBtn.addEventListener('click', ()=>{
    unlockAudio();
    if(timerState.running){
      stopInterval();
      timerState.running = false;
      timerState.endTime = null;
      clearSavedTimerState();
      releaseWakeLock();
      startPauseBtn.textContent = "Start";
    } else {
      if(timerState.remaining <= 0) timerState.remaining = timerState.total;
      timerState.endTime = Date.now() + timerState.remaining*1000;
      timerState.running = true;
      startPauseBtn.textContent = "Pause";
      timerState.interval = setInterval(tick, 250);
      saveTimerState();
      requestWakeLock();
    }
  });
  document.getElementById('timerReset').addEventListener('click', ()=>{
    stopInterval();
    timerState.remaining = timerState.total;

      saveTimerState();
    }
    updateDisplay();
  });
  document.getElementById('timerClose').addEventListener('click', closeTimer);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeTimer(); });
  document.getElementById('restTimerBtn').addEventListener('click', ()=> openTimer(60, "Rest"));

  // Recover a timer that was running when the screen locked / app was backgrounded.
  function tryResumeTimer(){
    const saved = loadSavedTimerState();
    if(!saved || saved.endTime == null) return;
    const remainingMs = saved.endTime - Date.now();
    stopInterval();
    timerState.total = saved.total;
    labelEl.textContent = saved.label;
    if(remainingMs <= 0){
      // Finished while the screen was locked — surface it now.
      clearSavedTimerState();
      timerState.remaining = 0;
      timerState.running = false;
      timerState.endTime = null;
      startPauseBtn.textContent = "Start";
      updateDisplay();
      renderPresets();
      overlay.classList.add('show');
      playAlarm();
    } else {
      timerState.remaining = Math.ceil(remainingMs/1000);
      timerState.endTime = saved.endTime;
      timerState.running = true;
      startPauseBtn.textContent = "Pause";
      updateDisplay();
      renderPresets();
      overlay.classList.add('show');
      timerState.interval = setInterval(tick, 250);
      requestWakeLock();
    }
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') tryResumeTimer();
  });

          const lastLine = document.createElement('div');
          lastLine.className = 'log-last';
          const wPart = last.weight != null ? last.weight+' lb' : '—';
          const rPart = last.reps != null ? last.reps : '—';
          lastLine.textContent = 'Last time: ' + wPart + ' × ' + rPart + ' (' + last.date + ')';
          item.appendChild(lastLine);
          const sw = suggestedWeight(last);
          if(sw != null){
            const tryLine = document.createElement('div');
            tryLine.className = 'log-last';
            tryLine.style.color = 'var(--accent)';
            tryLine.textContent = 'Try: ' + sw + ' lb this time';
            item.appendChild(tryLine);
          }
        }
      }

      wrap.appendChild(item);
    });

    container.appendChild(wrap);

    // ---- add-move control ----
    const addKey = dayIdx + "|" + sectionKey;
    const addWrap = document.createElement('div');
    if(openAdd.has(addKey)){
      const form = document.createElement('div');
      form.className = 'add-move-form';

      const nameInp = document.createElement('input');
      nameInp.type = 'text';
      nameInp.placeholder = 'Exercise name';

      const setsInp = document.createElement('input');
      setsInp.type = 'text';
      setsInp.placeholder = 'Sets/reps (optional), e.g. 3 × 10';

      const btnRow = document.createElement('div');
      btnRow.className = 'row-btns';
      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'primary';
      saveBtn.textContent = 'Add';
      saveBtn.addEventListener('click', ()=>{
        const nm = nameInp.value.trim();
        if(nm){
          addCustomExercise(dayIdx, sectionKey, nm, setsInp.value.trim());
          openAdd.delete(addKey);
          renderToday(); renderWorkout(); renderLadder(); renderProgress();
        }
      });
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'cancel';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', ()=>{
        openAdd.delete(addKey);
        renderToday(); renderWorkout();
      });
      btnRow.appendChild(cancelBtn);
      btnRow.appendChild(saveBtn);

      form.appendChild(nameInp);
      form.appendChild(setsInp);
      form.appendChild(btnRow);
      addWrap.appendChild(form);
    } else {
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'add-move-btn';
      addBtn.textContent = '+ Add move';
      addBtn.addEventListener('click', ()=>{
        openAdd.add(addKey);
        renderToday(); renderWorkout();
      });
      addWrap.appendChild(addBtn);
    }
    container.appendChild(addWrap);
  }

  // ---------------- RENDER: TODAY ----------------
  function renderToday(){
    const el = document.getElementById('view-today');
    el.innerHTML = "";
    const naturalIdx = DAY_NAMES.indexOf(todayName);
    const dayIdx = selectedOverrideIdx !== null ? selectedOverrideIdx : naturalIdx;

    // Day picker — always available, so a missed day can be made up on another day
    const pickerCard = document.createElement('div');
    pickerCard.className = 'day-select-card';
    const pickerLabel = document.createElement('div');
    pickerLabel.className = 'section-label';
    pickerLabel.style.margin = '0';
    pickerLabel.textContent = '📅 Which workout?';
    pickerCard.appendChild(pickerLabel);

    const select = document.createElement('select');
    const restOpt = document.createElement('option');
    restOpt.value = '-1';
    restOpt.textContent = 'Rest — skip today';
    select.appendChild(restOpt);
    DAY_NAMES.forEach((name,i)=>{
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = WEEK[i].day + ' — ' + WEEK[i].focus + (name===todayName ? ' (usual day)' : '');
      select.appendChild(opt);
    });
    select.value = String(dayIdx);
    select.addEventListener('change', ()=>{
      const v = parseInt(select.value,10);
      selectedOverrideIdx = v;
      renderToday();
    });
    pickerCard.appendChild(select);

    const hint = document.createElement('p');
    hint.className = 'day-select-hint';
    hint.textContent = 'Missed a day? Pick it here — checking it off still counts for that day on your ladder.';
    pickerCard.appendChild(hint);

    el.appendChild(pickerCard);

    if(dayIdx === -1){
      const card = document.createElement('div');
      card.className = 'card rest-card';
      card.innerHTML = '<div class="big">🧘 Rest Day</div><p>Recovery day. Light walk optional — no lifting needed.</p>';
      el.appendChild(card);
      return;
    }

    const dateK = weekDates[dayIdx];
    const plan = WEEK[dayIdx];

    if(dateK !== todayKey){
      const note = document.createElement('div');
      note.className = 'makeup-note';
      note.textContent = '⚡ Logging ' + plan.day + '\'s workout today — it\'ll mark ' + plan.day + ' complete on your ladder.';
      el.appendChild(note);
    }

    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'day-heading';
    head.innerHTML = '<h2>'+plan.day+'</h2>';
    card.appendChild(head);

    const focus = document.createElement('p');
    focus.className = 'day-focus';
    focus.textContent = plan.focus;
    card.appendChild(focus);

    renderSection(card, dateK, dayIdx, 'warmup', 'Warm-Up', '🔥', plan.warmup);
    renderSection(card, dateK, dayIdx, 'main', 'Main Work', '💪', plan.main, combinedMainNote(plan.mainNote));
    renderSection(card, dateK, dayIdx, 'cooldown', 'Cool-Down', '🧘', plan.cooldown);

    const banner = document.createElement('div');
    banner.className = 'complete-banner' + (isDayComplete(dateK, dayIdx) ? ' show':'');
    banner.textContent = "✓ Workout complete — nice work.";
    card.appendChild(banner);

    el.appendChild(card);
  }

  // ---------------- RENDER: WORKOUT (full week) ----------------
  let openDay = null;
  function renderWorkout(){
    const el = document.getElementById('view-workout');
    el.innerHTML = "";
    WEEK.forEach((plan, i)=>{
      const dk = weekDates[i];
      const wd = document.createElement('div');
      wd.className = 'week-day' + (openDay===i ? ' open':'');

      const head = document.createElement('div');
      head.className = 'week-day-head';
      head.tabIndex = 0;
      head.innerHTML = '<div><h3>'+plan.day+(plan.day===todayName ? ' · Today':'')+'</h3><span class="f">'+plan.focus+'</span></div><span class="chevron">▾</span>';
      const toggleOpen = ()=>{ openDay = (openDay===i) ? null : i; renderWorkout(); };
      head.addEventListener('click', toggleOpen);
      head.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleOpen(); }});
      wd.appendChild(head);

      const body = document.createElement('div');
      body.className = 'week-day-body';
      if(openDay===i){
        renderSection(body, dk, i, 'warmup', 'Warm-Up', '🔥', plan.warmup);
        renderSection(body, dk, i, 'main', 'Main Work', '💪', plan.main, combinedMainNote(plan.mainNote));
        renderSection(body, dk, i, 'cooldown', 'Cool-Down', '🧘', plan.cooldown);
      }
      wd.appendChild(body);
      el.appendChild(wd);
    });
  }

  // ---------------- RENDER: PROGRESS ----------------
  function computeStreak(){
    let streak = 0;
    let cursor = new Date(today);
    for(let i=0;i<60;i++){
      const name = cursor.toLocaleDateString('en-US',{weekday:'long'});
      const idx = DAY_NAMES.indexOf(name);
      if(idx === -1){ cursor.setDate(cursor.getDate()-1); continue; }
      const dk = dateKey(cursor);
      if(isDayComplete(dk, idx)){ streak++; cursor.setDate(cursor.getDate()-1); }
      else break;
    }
    return streak;
  }
  function totalCompletedThisWeek(){
    let n = 0;
    WEEK.forEach((plan,i)=>{ if(isDayComplete(weekDates[i], i)) n++; });
    return n;
  }
  function renderProgress(){
    const el = document.getElementById('view-progress');
    el.innerHTML = "";

    const stats = document.createElement('div');
    stats.className = 'stat-row';
    stats.innerHTML =
      '<div class="stat"><div class="num">'+totalCompletedThisWeek()+'/7</div><div class="lab">DAYS THIS WEEK</div></div>'+
      '<div class="stat"><div class="num">'+computeStreak()+'</div><div class="lab">DAY STREAK</div></div>';
    el.appendChild(stats);

    const card = document.createElement('div');
    card.className = 'card';
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = '📊 This Week';
    card.appendChild(lbl);

    const bars = document.createElement('div');
    bars.className = 'bars';
    const allDays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    for(let i=0;i<7;i++){
      const col = document.createElement('div');
      col.className = 'bar-col';
      const bar = document.createElement('div');
      const pct = dayCompletion(weekDates[i], i);
      bar.className = 'bar' + (pct>=1 ? ' done':'');
      bar.style.height = Math.max(8, pct*100) + 'px';
      const lab = document.createElement('div');
      lab.className = 'bar-lab';
      lab.textContent = allDays[i];
      col.appendChild(bar);
      col.appendChild(lab);
      bars.appendChild(col);
    }
    card.appendChild(bars);
    el.appendChild(card);
  }

  // ---------------- RENDER: COACH ----------------
  function renderCoach(){
    const el = document.getElementById('view-coach');
    el.innerHTML = "";
    const dayOfYear = Math.floor((today - new Date(today.getFullYear(),0,0)) / 86400000);
    const tip = TIPS[dayOfYear % TIPS.length];

    const tipCard = document.createElement('div');
    tipCard.className = 'tip-card';
    tipCard.innerHTML = "<div class=\"tip-eyebrow\">Today's Note</div><div class=\"tip-body\">"+tip+"</div>";
    el.appendChild(tipCard);

    const card = document.createElement('div');
    card.className = 'card';
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.style.marginTop = '2px';
    lbl.textContent = '📌 Core Principles';
    card.appendChild(lbl);
    PRINCIPLES.forEach((p,i)=>{
      const row = document.createElement('div');
      row.className = 'principle';
      row.innerHTML = '<div class="n">0'+(i+1)+'</div><div><div class="p-title">'+p.t+'</div><div class="p-body">'+p.b+'</div></div>';
      card.appendChild(row);
    });
    el.appendChild(card);
  }

  // ---------------- NAV ----------------
  const views = {
    today: document.getElementById('view-today'),
    workout: document.getElementById('view-workout'),
    progress: document.getElementById('view-progress'),
    coach: document.getElementById('view-coach')
  };
  document.querySelectorAll('nav.bottom button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(views).forEach(v=>v.classList.remove('active'));
      views[btn.dataset.view].classList.add('active');
    });
  });

  // ---------------- INIT ----------------
  const subtitleEl = document.getElementById('weekSubtitle');
  if(subtitleEl) subtitleEl.textContent = 'Week ' + currentWeekLetter + ' (' + currentWeekStyle.name + ') of your 4-week cycle.';
  renderLadder();
  renderToday();
  renderWorkout();
  renderProgress();
  renderCoach();

})();
</script>
</body>
</html>
